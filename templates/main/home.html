{% extends "main/master/base.html" %}
{% block content %}
    <!-- ========================= SECTION MAIN ========================= -->
    <section class="section-intro padding-y-sm">
      <div class="container">
        <div class="intro-banner-wrap">
          <img src="images/banners/2.jpg" class="img-fluid rounded" />
        </div>
      </div>
      <!-- container //  -->
    </section>
    <!-- ========================= SECTION MAIN END// ========================= -->

    <!-- ========================= SECTION  ========================= -->
    <section class="section-name padding-y-sm">
      <div class="container">
        <header class="section-heading">
          <a href="{% url 'products' %}}" class="btn btn-outline-primary float-right"
            >See all</a
          >
          <h3 class="section-title">Popular products</h3>
        </header>
        <!-- sect-heading -->
        <div class="row">
            {% for product in products %}
            <div class="col-md-3">
                <div class="card card-product-grid">

                    <a href="{% url 'product_details' product.category.slug product.slug %}" class="img-wrap">
                        <img src="{{ product.product_image.url }}" alt="{{ product.product_name }}">
                    </a>

                    <figcaption class="info-wrap">
                        <a href="{% url 'product_details' product.category.slug product.slug %}" class="title">
                            {{ product.product_name }}
                        </a>

                        <div class="price mt-1">
                            ${{ product.price }}
                        </div>
                    </figcaption>
                </div>
            </div>
            {% endfor %}
        </div>
        <!-- row.// -->
      </div>
      <!-- container // -->
    </section>

    <section class="section-name padding-y-sm">
    <div class="container">
        <header class="section-heading">
            <a href="{% url 'blog' %}" class="btn btn-outline-primary float-right">
                See all
            </a>
            <h3 class="section-title">Latest Blogs</h3>
        </header>

        <div class="row">
            {% for blog in blogs %}
            <div class="col-md-3">
                <div class="card card-product-grid">

                    <a href="{% url 'blog_detail' blog.id %}" class="img-wrap">
                        <img src="{{ blog.blog_image.url }}" alt="{{ blog.title }}">
                    </a>

                    <figcaption class="info-wrap">
                        <a href="{% url 'blog_detail' blog.id %}" class="title">
                            {{ blog.title }}
                        </a>

                        <p class="text-muted small mt-2">
                            {{ blog.created_at|date:"M d, Y" }}
                        </p>

                        <p class="small">
                            {{ blog.content|truncatewords:15 }}
                        </p>
                    </figcaption>

                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

{% endblock content %}
