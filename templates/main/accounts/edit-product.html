{% extends "main/master/base.html" %} {% block content %}
<section class="section-conten padding-y bg">
  <div class="container">
    <div class="row">
      <aside class="col-md-3">
        <ul class="list-group">
          <a class="list-group-item" href="/accounts/dashboard/"> Dashboard </a>
          <a class="list-group-item" href="/accounts/my-products/">
            My Products
          </a>
          <a class="list-group-item" href="/accounts/add-product/">
            Add Product
          </a>

          <a class="list-group-item" href="/accounts/my-orders/"> My Orders </a>
          <a class="list-group-item" href="/accounts/my-sales/"> My Sales </a>
          <a class="list-group-item" href="/accounts/my-requests-sent/">
            My Sent Requests
          </a>
          <a class="list-group-item" href="/accounts/my-requests-received/">
            My Received Requests
          </a>
          <a class="list-group-item" href="/accounts/messages/inbox/">
            Messages
          </a>

          <a class="list-group-item" href="/accounts/messages/sent/"> Sent </a>

          <a class="list-group-item" href="/accounts/edit-profile/">
            Edit Profile
          </a>

          <a class="list-group-item" href="/accounts/change-password/">
            Change Password
          </a>
        </ul>
        <br />
        <a class="btn btn-light btn-block" href="/accounts/logout/">
          <i class="fa fa-power-off"></i> <span class="text">Log out</span>
        </a>
      </aside>

      <main class="col-md-9">
        <article class="card">
          <header
            class="card-header d-flex justify-content-between align-items-center"
          >
            <strong class="d-inline-block mr-3">Post a Product</strong>
          </header>

          <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
              <input
                type="hidden"
                name="csrfmiddlewaretoken"
                value="iMUcDKwhp5OWdpGCSuOIojH5bLAH9odZoONKwvr7yLrMSk5oaYhVraukNU3nKJOp"
              />

              <div class="form-row">
                <div class="form-group col-md-12">
                  <label for="id_product_name">Product name:</label>
                  <input
                    type="text"
                    name="product_name"
                    value="Samsung S25 Ultra"
                    maxlength="200"
                    class="form-control"
                    required
                    id="id_product_name"
                  />
                </div>
              </div>

              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="id_category">Category:</label>
                  <select
                    name="category"
                    class="form-control"
                    required
                    id="id_category"
                  >
                    <option value="">---------</option>

                    <option value="1">Accessories</option>

                    <option value="2">Books</option>

                    <option value="3" selected>Electronics</option>

                    <option value="4">Shirts</option>

                    <option value="5">Jeans</option>

                    <option value="6">Shoes</option>

                    <option value="7">Jackets</option>

                    <option value="8">Home &amp; Living</option>
                  </select>
                </div>
                <div class="form-group col-md-3">
                  <label for="id_price">Price:</label>
                  <input
                    type="number"
                    name="price"
                    value="200000"
                    class="form-control"
                    required
                    id="id_price"
                  />
                </div>
                <div class="form-group col-md-3">
                  <label for="id_stock">Stock:</label>
                  <input
                    type="number"
                    name="stock"
                    value="5"
                    class="form-control"
                    required
                    id="id_stock"
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="id_description">Description:</label>
                <textarea
                  name="description"
                  cols="40"
                  rows="10"
                  maxlength="1000"
                  class="form-control"
                  id="id_description"
                >
New Samsung S25 Ultra Phone</textarea
                >
              </div>

              <div class="form-group">
                <label for="id_images">Images:</label>
                <input
                  type="file"
                  name="images"
                  class="form-control form-control"
                  accept="image/*"
                  id="id_images"
                />
              </div>

              <div class="form-group">
                <label for="id_status">Status:</label>
                <input
                  type="checkbox"
                  name="status"
                  class="form-control"
                  id="id_status"
                  checked
                />
                <small class="form-text text-muted"
                  >If off, your product stays hidden even after approval.</small
                >
              </div>

              <button type="submit" class="btn btn-primary">
                Submit for Approval
              </button>
            </form>
          </div>
        </article>
      </main>
    </div>
  </div>
</section>
{% endblock %}
