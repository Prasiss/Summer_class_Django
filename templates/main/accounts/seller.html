{% extends "main/master/base.html" %} {% block content %}
<section class="section-content padding-y bg">
  <div class="container">
    <!-- Seller header -->
    <div class="card mb-3">
      <div class="card-body d-flex align-items-center">
        <div class="mr-3">
          <img
            src="/static/images/default/default-user.png"
            class="rounded-circle"
            style="width: 64px; height: 64px; object-fit: cover"
            alt="Seller"
          />
        </div>
        <div class="flex-grow-1">
          <h5 class="mb-1">Sandhya Dumre</h5>
          <small class="text-muted">Member since Aug 2026</small>
        </div>
        <div class="ml-3">
          <a
            href="/store/seller/12/"
            class="btn btn-sm btn-outline-primary disabled"
            >Message</a
          >
        </div>
      </div>
    </div>

    <header
      class="section-heading d-flex align-items-center justify-content-between"
    >
      <h3 class="section-title mb-0">Products by this seller</h3>
      <small class="text-muted">3 items</small>
    </header>

    <!-- ===== SAME GRID DESIGN START ===== -->
    <div class="row">
      <div class="col-md-4">
        <figure class="card card-product-grid">
          <div class="img-wrap">
            <a href="/store/category/accessories/lipstick/">
              <img
                src="/media/photos/products/e8b956ed2ce8ee77e27a286fa33d0430.jpg"
              />
            </a>
          </div>
          <!-- img-wrap.// -->
          <figcaption class="info-wrap">
            <div class="fix-height">
              <a href="/store/category/accessories/lipstick/" class="title">
                lipstick
              </a>
              <div class="price-wrap mt-2">
                <span class="price">Rs.1900</span>
                <del class="price-old">Rs.1900</del>
              </div>
              <!-- price-wrap.// -->
            </div>
            <a
              href="/store/category/accessories/lipstick/"
              class="btn btn-block btn-primary"
              >View Details</a
            >
          </figcaption>
        </figure>
      </div>

      <div class="col-md-4">
        <figure class="card card-product-grid">
          <div class="img-wrap">
            <a href="/store/category/accessories/necklace/">
              <img
                src="/media/photos/products/b8191448d07759f862b8a6592fa25113.jpg"
              />
            </a>
          </div>
          <!-- img-wrap.// -->
          <figcaption class="info-wrap">
            <div class="fix-height">
              <a href="/store/category/accessories/necklace/" class="title">
                Necklace
              </a>
              <div class="price-wrap mt-2">
                <span class="price">Rs.2200</span>
                <del class="price-old">Rs.2200</del>
              </div>
              <!-- price-wrap.// -->

              <p class="text-warning small mb-1">Only 4 left in stock!</p>
            </div>
            <a
              href="/store/category/accessories/necklace/"
              class="btn btn-block btn-primary"
              >View Details</a
            >
          </figcaption>
        </figure>
      </div>

      <div class="col-md-4">
        <figure class="card card-product-grid">
          <div class="img-wrap">
            <a href="/store/category/shoes/shoes/">
              <img
                src="/media/photos/products/nike-sabrina-1-spark-purple-yellow-release-date-2.webp"
              />
            </a>
          </div>
          <!-- img-wrap.// -->
          <figcaption class="info-wrap">
            <div class="fix-height">
              <a href="/store/category/shoes/shoes/" class="title"> shoes </a>
              <div class="price-wrap mt-2">
                <span class="price">Rs.3500</span>
                <del class="price-old">Rs.3500</del>
              </div>
              <!-- price-wrap.// -->

              <p class="text-warning small mb-1">Only 3 left in stock!</p>
            </div>
            <a
              href="/store/category/shoes/shoes/"
              class="btn btn-block btn-primary"
              >View Details</a
            >
          </figcaption>
        </figure>
      </div>

      <!-- col.// -->
    </div>
    <!-- row end.// -->
    <!-- ===== SAME GRID DESIGN END ===== -->
  </div>
</section>
{% endblock %}
