{% extends 'design/master/base1.html' %}

{% block content %}
    <h1>{{ page.title }}</h1>
    <div>
        {{ page.content|safe }}

    </div>
    {% if page.page_image %}
        <img src="{{ page.page_image.url }}" alt="{{ page.title }}" style="width: 200px;">
    {% else %}
        <p>No image available for this page.</p>
    {% endif %}
{% endblock %}
